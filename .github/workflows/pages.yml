# Durable iPhone Safari preview: production dist/ on GitHub Pages.
# Expected URL: https://ankitshahy-crypto.github.io/visual-guide/
#
# One-time owner click (if the first run fails with "Get Pages site failed"):
#   Repo → Settings → Pages → Build and deployment → Source: GitHub Actions
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Production build for project Pages
        run: npm run build
        env:
          # Project site lives at /visual-guide/, not the domain root.
          VITE_BASE: /visual-guide/
      - name: Pages extras
        run: |
          test -f dist/index.html
          test -f dist/404.html
          touch dist/.nojekyll
          grep -q '/visual-guide/' dist/index.html
          node scripts/check-pages-chunks.mjs
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
